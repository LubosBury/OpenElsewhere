name: OpenElsewhere
options:
  bundleIdPrefix: com.openelsewhere
  deploymentTarget:
    macOS: "26.0"
  # Drives LastUpgradeCheck. Leaving this behind the installed Xcode is what
  # makes it offer "Update to recommended settings" — an offer that must be
  # declined, because it rewrites Release's CODE_SIGN_IDENTITY to "Apple
  # Development" and that channel ships a notarized DMG, which requires
  # Developer ID. The recommendations worth having are set below instead.
  xcodeVersion: "26.6"

configs:
  Debug: debug
  Release: release
  ReleaseAppStore: release

# Declared here, not left as hand-made files in xcshareddata: `xcodegen
# generate` rewrites the project and removes schemes it does not know about,
# and scripts/build-appstore.sh and build-dmg.sh both invoke
# `xcodebuild -scheme OpenElsewhere`. Each script passes its own
# -configuration, so the scheme's archive config is only the Xcode default.
schemes:
  OpenElsewhere:
    build:
      targets:
        OpenElsewhere: all
    run:
      config: Debug
      # Local StoreKit products. Without this the tip jar has nothing to show
      # — a build that did not come from the App Store or TestFlight has no
      # receipt, so Product.products(for:) returns empty and the row hides
      # itself. Ignored by App Store builds, which use the real products.
      storeKitConfiguration: OpenElsewhere.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  OpenElsewhere_appstore:
    build:
      targets:
        OpenElsewhere: all
    run:
      config: Debug
      # Local StoreKit products. Without this the tip jar has nothing to show
      # — a build that did not come from the App Store or TestFlight has no
      # receipt, so Product.products(for:) returns empty and the row hides
      # itself. Ignored by App Store builds, which use the real products.
      storeKitConfiguration: OpenElsewhere.storekit
    profile:
      config: ReleaseAppStore
    analyze:
      config: Debug
    archive:
      config: ReleaseAppStore

targets:
  OpenElsewhere:
    type: application
    platform: macOS
    sources:
      - OpenElsewhere/Sources
      # XcodeGen has no target-level `resources:` key — an entry there is
      # silently dropped, which is why the app shipped with no icon. Asset
      # catalogs listed under `sources` land in the Resources build phase.
      - OpenElsewhere/Resources/Assets.xcassets
    info:
      path: OpenElsewhere/Resources/Info.plist
      properties:
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSAppleEventsUsageDescription: "OpenElsewhere uses automation to open links as new tabs in your browser's existing window (instead of popup windows)."
        CFBundleURLTypes:
          - CFBundleURLName: "Web URL"
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: "HTML Document"
            LSItemContentTypes:
              - public.html
              - public.xhtml
              - public.url
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openelsewhere.app
        PRODUCT_NAME: OpenElsewhere
        # Without this, actool compiles the catalog but extracts nothing: an
        # icon set is only emitted when it is named as *the* app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode's recommended settings, adopted here so the spec stays the
        # source of truth. Its "Switch to Development Signing" item is
        # deliberately not among them — see xcodeVersion above.
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: OpenElsewhere/Resources/Info.plist
        DEVELOPMENT_TEAM: 78QQBJB52G
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: OpenElsewhere/Resources/OpenElsewhere.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          # Developer ID channel: notarized DMG via Homebrew. Not sandboxed.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
        ReleaseAppStore:
          # Mac App Store channel: sandboxed, Apple Distribution signed.
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: OpenElsewhere/Resources/OpenElsewhere-AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
