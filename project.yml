name: OpenElsewhere
options:
  bundleIdPrefix: com.openelsewhere
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release
  ReleaseAppStore: release

targets:
  OpenElsewhere:
    type: application
    platform: macOS
    sources:
      - OpenElsewhere/Sources
    resources:
      - OpenElsewhere/Resources/Assets.xcassets
    info:
      path: OpenElsewhere/Resources/Info.plist
      properties:
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSAppleEventsUsageDescription: "OpenElsewhere uses automation to open links as new tabs in your browser's existing window (instead of popup windows)."
        CFBundleURLTypes:
          - CFBundleURLName: "Web URL"
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: "HTML Document"
            LSItemContentTypes:
              - public.html
              - public.xhtml
              - public.url
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openelsewhere.app
        PRODUCT_NAME: OpenElsewhere
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: OpenElsewhere/Resources/Info.plist
        DEVELOPMENT_TEAM: 78QQBJB52G
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: OpenElsewhere/Resources/OpenElsewhere.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          # Developer ID channel: notarized DMG via Homebrew. Not sandboxed.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
        ReleaseAppStore:
          # Mac App Store channel: sandboxed, Apple Distribution signed.
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: OpenElsewhere/Resources/OpenElsewhere-AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
